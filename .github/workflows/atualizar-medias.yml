name: Atualizar médias de lance

on:
  schedule:
    # Toda segunda-feira às 09:00 UTC (~06:00 horário de Brasília)
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rodar o robô (gera Maggi/medias.json)
        run: |
          cd Maggi
          python scraper.py

      - name: Salvar medias.json atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # medias.json e 100% gerado pelo robo: guardamos o arquivo gerado,
          # pegamos a versao mais nova do servidor e aplicamos por cima.
          # Assim nunca ha conflito de merge (mesmo em re-run de commit antigo).
          cp Maggi/medias.json /tmp/medias.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/medias.json Maggi/medias.json
          git add Maggi/medias.json
          if git diff --staged --quiet; then
            echo "Sem mudancas para commitar."
            exit 0
          fi
          git commit -m "Atualiza Maggi/medias.json [automatico]"
          git push
