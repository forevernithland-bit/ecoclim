name: Atualizar médias de lance

on:
  schedule:
    # Toda segunda-feira às 09:00 UTC (~06:00 horário de Brasília)
    - cron: '0 9 * * 1'
  workflow_dispatch: {}   # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rodar o robô (gera Maggi/medias.json)
        run: |
          cd Maggi
          python scraper.py

      - name: Salvar medias.json atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Maggi/medias.json
          git commit -m "Atualiza Maggi/medias.json [automatico]" || echo "Sem mudancas para commitar"
          git push
